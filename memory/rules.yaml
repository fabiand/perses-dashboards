#apiVersion: monitoring.rhobs/v1
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memory-dashboard-rules
  namespace: openshift-monitoring # You may adjust this namespace as needed
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cluster_operator_node_memory.rules
      rules:
        # 1. System & Kubelet Reserved Memory
        - record: openshift_node_memory_bytes
          expr: |
            kube_node_status_capacity{resource="memory"}
            -
            kube_node_status_allocatable{resource="memory"}
          labels:
            state: "reserved"
            scope: "system"

        # 2. Node Hot Memory in Use (Scoped strictly to pods)
        - record: openshift_node_memory_bytes
          expr: |
            sum by (node) (
              container_memory_working_set_bytes{container!="", id=~"/kubepods.*"}
            )
          labels:
            state: "hot"
            scope: "workload"

        # 3. Workload Safe Available Memory (Headroom)
        - record: openshift_node_memory_bytes
          expr: |
            kube_node_status_allocatable{resource="memory"}
            -
            openshift_node_memory_bytes{state="hot", scope="workload"}
          labels:
            state: "headroom"
            scope: "workload"

        # 4. Hot Memory Fill Ratio
        - record: openshift_node_memory_ratio
          expr: |
            openshift_node_memory_bytes{state="hot", scope="workload"}
            /
            kube_node_status_allocatable{resource="memory"}
          labels:
            type: "hot_fill"
            scope: "workload"

    - name: cluster_operator_kubevirt_vm_memory.rules
      rules:
        # 5. Per-VM Hot Memory Usage
        - record: kubevirt_vm_memory_bytes
          expr: |
            container_memory_working_set_bytes{container="compute"}
          labels:
            state: "hot"
            workload_type: "kubevirt_vm"

        # 6. VM Hot Memory vs Requested Allocation Ratio
        - record: kubevirt_vm_memory_ratio
          expr: |
            container_memory_working_set_bytes{container="compute"}
            / on (pod, namespace) group_left()
            kube_pod_container_resource_requests{container="compute", resource="memory"}
          labels:
            type: "hot_to_request"
            workload_type: "kubevirt_vm"

    #
    # LEGACY
    #
    - name: legacy.memorydashboard.rules
      rules:
        #
        # System
        #
        - record: openshift:node:system:memory:reserved
          expr: |
            sum(kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:system:memory:utilization
          expr: |
            sum (container_memory_rss{id="/system.slice"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        #
        # Utilization
        #
        # Availability Risk (OOM)
        # (node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes) / node_memory_MemTotal_bytes
        # Performance risk (cache)
        # (node_memory_Active_anon_bytes + node_memory_Active_file_bytes) / node_memory_MemTotal_bytes

        # Combined - Availability or performance risk
        - record: openshift:node:workloads:memory:allocatable
          expr: |
            sum(kube_node_status_allocatable{resource="memory"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:workloads:memory:utilization
          expr: |
            # FIXME this should actually be
            # container_memory_total_Active_anon_bytes + container_memory_total_Inactive_anon_bytes + container_memory_total_Active_file_bytes
            # but cri/cadvisor does not provide these metrics today.
            # https://github.com/google/cadvisor/pull/3750/changes
            sum(label_replace((node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes + node_memory_Active_file_bytes),
                          "node", "$1",
                          "instance", "(.*)"))
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:workloads:swap
          expr: |
            sum(container_memory_swap{id="/kubepods.slice"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        - record: openshift:node:virtualization:memory:allocated
          expr: |
            sum(kubevirt_vmi_memory_domain_bytes)
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        #
        # Overcommittment
        #
        # Overcommitted - Negative values show under committment
        - record: openshift:node:virtualization:memory:overcommitted
          expr: |
            openshift:node:virtualization:memory:allocated - openshift:node:workloads:memory:allocatable
            
        - record: openshift:node:virtualization:overcommitted:ratio
          expr: |
            openshift:node:virtualization:memory:overcommitted / openshift:node:workloads:memory:allocatable
