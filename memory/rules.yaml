
#
# System
#
rules:
  - record: ocp:node:system:memory:reserved
    expr: kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"}
    labels:
      DevelopmentPreview: true
  - record: ocp:node:system:memory:utilization
    expr: container_memory_rss{id="/system.slice"}
    labels:
      DevelopmentPreview: true


#
# Utilization
#
# Availability Risk (OOM)
#(node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes) / node_memory_MemTotal_bytes
# Performance risk (cache)
#(node_memory_Active_anon_bytes + node_memory_Active_file_bytes) / node_memory_MemTotal_bytes

# Combined - Availability or performance risk
ocp:node:workloads:allocatable = kube_node_status_allocatable{resource="memory"}
ocp:node:workloads:utilization = (node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes + node_memory_Active_file_bytes)
ocp:node:workloads:swap = container_memory_swap{id="/kubepods.slice"}
ocp:node:virtualization:allocated = sum(kubevirt_vmi_memory_domain_bytes) by (node)

#
# Overcommittment
#
# Overcommitted - Negative values show under committment
ocp:node:virtualization:overcommitted = ocp:node:virtualization:allocated - on (node) ocp:node:workloads:allocatable
ocp:node:virtualization:overcommitted:ratio = ocp:node:virtualization:overcommitted / on (node) ocp:node:workloads:allocatable
