#apiVersion: monitoring.rhobs/v1
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memory-dashboard-rules
  namespace: openshift-monitoring # You may adjust this namespace as needed
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cluster_operator_node_memory.rules
      rules:
        # 1. System & Kubelet Reserved Memory
        - record: openshift_node_memory_bytes
          expr: |
            kube_node_status_capacity{resource="memory"}
            -
            kube_node_status_allocatable{resource="memory"}
          labels:
            usage: "reserved"
            scope: "system"
            DevelopmentPreview: "true"

        # 2. Node Hot Memory in Use (Scoped strictly to pods)
        - record: openshift_node_memory_bytes
          expr: |
            sum by (node) (
              container_memory_working_set_bytes{container!="", id=~"/kubepods.*"}
            )
          labels:
            usage: "hot"
            scope: "workload"
            DevelopmentPreview: "true"

        # 2a. Node Warm Memory (Inactive File Cache)
        # Inactive file-backed pages that are first candidates for eviction.
        # Reclaimable with minimal performance impact.
        - record: openshift_node_memory_bytes
          expr: |
            sum by (node) (
              container_memory_total_inactive_file_bytes{container!="", id=~"/kubepods.*"}
            )
          labels:
            usage: "warm"
            scope: "workload"
            DevelopmentPreview: "true"

        # 3. Workload Safe Available Memory (Remaining)
        - record: openshift_node_memory_bytes
          expr: |
            kube_node_status_allocatable{resource="memory"}
            -
            openshift_node_memory_bytes{usage="hot", scope="workload"}
          labels:
            usage: "remaining"
            scope: "workload"
            DevelopmentPreview: "true"

        # 4. Hot Memory Fill Ratio
        - record: openshift_node_memory_ratio
          expr: |
            openshift_node_memory_bytes{usage="hot", scope="workload"}
            /
            kube_node_status_allocatable{resource="memory"}
          labels:
            type: "hot_fill"
            scope: "workload"
            DevelopmentPreview: "true"

        # 5. Node VM Memory Commitment
        # Total virtual memory committed to all VMs on the node.
        # Sum of all VM domain allocations per node.
        - record: openshift_node_memory_committed_bytes
          expr: |
            sum by (node) (
              openshift_vm_memory_committed_bytes{workload_type="vm"}
            )
          labels:
            DevelopmentPreview: "true"

        # 6. Node VM Memory Commitment Ratio
        # Actual VM memory usage vs committed allocation per node.
        # Shows overall VM memory efficiency at the node level.
        - record: openshift_node_memory_committed_ratio
          expr: |
            sum by (node) (openshift_vm_memory_bytes{usage="hot", workload_type="vm"})
            /
            openshift_node_memory_committed_bytes
          labels:
            DevelopmentPreview: "true"

    - name: cluster_operator_kubevirt_vm_memory.rules
      rules:
        # 5a. Per-VM Hot Memory (VM Working Set)
        # Measures actual memory actively used by the VM.
        # This represents the current physical memory consumption of the running VM.
        - record: openshift_vm_memory_bytes
          expr: |
            sum by (name, namespace, node) (
              sum by (pod, namespace, node) (
                container_memory_working_set_bytes{container="compute", pod=~"virt-launcher-.*"}
              )
              * on (namespace, pod) group_left(name)
              label_replace(
                max by (name, namespace, node, vmi_pod) (kubevirt_vmi_info{vmi_pod!=""}),
                "pod", "$1", "vmi_pod", "(.*)"
              )
            )
          labels:
            usage: "hot"
            workload_type: "vm"
            DevelopmentPreview: "true"

        # 5a-warm. Per-VM Warm Memory (Inactive File Cache)
        # Inactive file-backed pages for the VM.
        # Reclaimable with minimal performance impact. Typically very low for VMs.
        - record: openshift_vm_memory_bytes
          expr: |
            sum by (name, namespace, node) (
              sum by (pod, namespace, node) (
                container_memory_total_inactive_file_bytes{container="compute", pod=~"virt-launcher-.*"}
              )
              * on (namespace, pod) group_left(name)
              label_replace(
                max by (name, namespace, node, vmi_pod) (kubevirt_vmi_info{vmi_pod!=""}),
                "pod", "$1", "vmi_pod", "(.*)"
              )
            )
          labels:
            usage: "warm"
            workload_type: "vm"
            DevelopmentPreview: "true"

        # 5b. Per-VM Reserved Memory (VM Infrastructure Overhead)
        # Fixed infrastructure memory overhead required to run the VM.
        # This includes memory for QEMU, libvirt, cache, and other virtualization
        # infrastructure components in the virt-launcher pod.
        - record: openshift_vm_memory_bytes
          expr: |
            max by (name, namespace, node) (kubevirt_vmi_launcher_memory_overhead_bytes)
          labels:
            usage: "reserved"
            workload_type: "vm"
            DevelopmentPreview: "true"

        # 5c. Per-VM Remaining Memory (VM Growth Capacity)
        # Memory available for the VM to grow within its allocated capacity.
        # Calculated as: reserved + allocation - hot.
        # Note: This can become negative when the VM uses all its allocated RAM and
        # the hypervisor requires significant cache to support the VM.
        - record: openshift_vm_memory_bytes
          expr: |
            openshift_vm_memory_bytes{usage="reserved", workload_type="vm"}
            +
            max by (name, namespace, node) (kubevirt_vmi_memory_domain_bytes)
            -
            openshift_vm_memory_bytes{usage="hot", workload_type="vm"}
          labels:
            usage: "remaining"
            workload_type: "vm"
            DevelopmentPreview: "true"

        # 5d. Per-VM Committed Memory
        # Virtual memory allocated to the VM (domain capacity).
        # This is what the guest sees as available RAM.
        - record: openshift_vm_memory_committed_bytes
          expr: |
            max by (name, namespace, node) (kubevirt_vmi_memory_domain_bytes)
          labels:
            workload_type: "vm"
            DevelopmentPreview: "true"

        # 5e. Per-VM Commitment Ratio
        # Actual VM memory usage vs allocated capacity.
        # Shows how much of the VM's allocated memory is actively used.
        - record: openshift_vm_memory_committed_ratio
          expr: |
            openshift_vm_memory_bytes{usage="hot", workload_type="vm"}
            /
            openshift_vm_memory_committed_bytes{workload_type="vm"}
          labels:
            workload_type: "vm"
            DevelopmentPreview: "true"

    #
    # LEGACY
    #
    - name: legacy.memorydashboard.rules
      rules:
        #
        # System
        #
        - record: openshift:node:system:memory:reserved
          expr: |
            sum(kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:system:memory:utilization
          expr: |
            sum (container_memory_rss{id="/system.slice"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        #
        # Utilization
        #
        # Availability Risk (OOM)
        # (node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes) / node_memory_MemTotal_bytes
        # Performance risk (cache)
        # (node_memory_Active_anon_bytes + node_memory_Active_file_bytes) / node_memory_MemTotal_bytes

        # Combined - Availability or performance risk
        - record: openshift:node:workloads:memory:allocatable
          expr: |
            sum(kube_node_status_allocatable{resource="memory"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:workloads:memory:utilization
          expr: |
            # FIXME this should actually be
            # container_memory_total_Active_anon_bytes + container_memory_total_Inactive_anon_bytes + container_memory_total_Active_file_bytes
            # but cri/cadvisor does not provide these metrics today.
            # https://github.com/google/cadvisor/pull/3750/changes
            sum(label_replace((node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes + node_memory_Active_file_bytes),
                          "node", "$1",
                          "instance", "(.*)"))
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:workloads:swap
          expr: |
            sum(container_memory_swap{id="/kubepods.slice"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        - record: openshift:node:virtualization:memory:allocated
          expr: |
            sum(kubevirt_vmi_memory_domain_bytes)
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        #
        # Overcommittment
        #
        # Overcommitted - Negative values show under committment
        - record: openshift:node:virtualization:memory:overcommitted
          expr: |
            openshift:node:virtualization:memory:allocated - openshift:node:workloads:memory:allocatable
            
        - record: openshift:node:virtualization:overcommitted:ratio
          expr: |
            openshift:node:virtualization:memory:overcommitted / openshift:node:workloads:memory:allocatable
