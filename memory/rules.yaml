#apiVersion: monitoring.rhobs/v1
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memory-dashboard-rules
  #namespace: openshift-monitoring # You may adjust this namespace as needed
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    #
    # Base Rules
    #
    - name: cluster_operator_node_memory_base.rules
      rules:
        - record: openshift:node:memory:tier:info
          expr: |
            up * 0 + 1  # Constant 1
          labels:
            tier: "0"
            technology: "dram"

        - record: openshift:node:memory:tier:info
          expr: |
            up * 0 + 1  # Constant 1
          labels:
            tier: "2"
            technology: "swap"

    #
    # Tier 1 Rules
    #
    - name: cluster_operator_node_memory_tier1.rules
      rules:
        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "system"
            utilized: "true"
            temperature: "hot"
            unit: bytes
          expr: |
            sum by (node) (
              container_memory_working_set_bytes{id="/system.slice"}
            )

        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "system"
            utilized: "true"
            temperature: "warm"
            unit: bytes
          expr: |
            sum by (node) (
              container_memory_total_inactive_file_bytes{id="/system.slice"}
            )

        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "system"
            utilized: "false"
            unit: bytes
          expr: |
            clamp_min(
              (kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"})
              - on (node)
              (
                # Hot: system working set (same as openshift:node:memory:bytes{scope="system", temperature="hot"})
                sum by (node) (container_memory_working_set_bytes{id="/system.slice"})
                +
                # Warm: system inactive file cache (same as openshift:node:memory:bytes{scope="system", temperature="warm"})
                sum by (node) (container_memory_total_inactive_file_bytes{id="/system.slice"})
              ),
              0
            )

        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "workloads"
            utilized: "true"
            usage: "system-overflow"
            unit: bytes
          expr: |
            clamp_min(
              (
                # System total usage
                # Hot: system working set (same as openshift:node:memory:bytes{scope="system", temperature="hot"})
                sum by (node) (container_memory_working_set_bytes{id="/system.slice"})
                +
                # Warm: system inactive file cache (same as openshift:node:memory:bytes{scope="system", temperature="warm"})
                sum by (node) (container_memory_total_inactive_file_bytes{id="/system.slice"})
              )
              - on (node) group_left()
              # System reserved amount
              (kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"}),
              0
            )

        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "workloads"
            utilized: "true"
            temperature: "hot"
            unit: bytes
          expr: |
            sum by (node) (
              # container_memory_working_set_bytes{container!="", id=~"/kubepods.*"}
              container_memory_working_set_bytes{id="/kubepods.slice"}
            )

        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "workloads"
            utilized: "true"
            temperature: "warm"
            unit: bytes
          expr: |
            sum by (node) (
              # container_memory_total_inactive_file_bytes{container!="", id=~"/kubepods.*"}
              container_memory_total_inactive_file_bytes{id="/kubepods.slice"}
            )

        - record: openshift:node:memory:bytes
          labels:
            tier: "0"
            scope: "workloads"
            utilized: "false"
            unit: bytes
          expr: |
            sum by (node) (
              kube_node_status_allocatable{resource="memory"}
              - on (node)
              (
                # Hot: workload working set (same as openshift:node:memory:bytes{scope="workloads", tier="0", temperature="hot"})
                sum by (node) (container_memory_working_set_bytes{id="/kubepods.slice"})
                +
                # Warm: workload inactive file cache (same as openshift:node:memory:bytes{scope="workloads", tier="0", temperature="warm"})
                sum by (node) (container_memory_total_inactive_file_bytes{id="/kubepods.slice"})
                +
                # System overflow: when system uses more than reserved, subtract from workloads free
                clamp_min(
                  (
                    sum by (node) (container_memory_working_set_bytes{id="/system.slice"})
                    +
                    sum by (node) (container_memory_total_inactive_file_bytes{id="/system.slice"})
                  )
                  - on (node) group_left()
                  (kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"}),
                  0
                )
              )
            )

        - record: openshift:node:memory:utilization:ratio
          labels:
            tier: "1"
            scope: "workloads"
            unit: ratio
          expr: |
            sum by (node) (openshift:node:memory:bytes{utilized="true", scope="workloads"})
            / on (node)
            kube_node_status_allocatable{resource="memory"}

        - record: openshift:node:memory:overcommit:ratio
          labels:
            tier: "1"
            scope: "workloads"
            unit: ratio
          expr: |
            sum by (node) (openshift:vm:memory:virtual_committed:bytes)
            / on (node)
            kube_node_status_allocatable{resource="memory"}

        - record: openshift:cluster:memory:utilization:ratio
          labels:
            scope: "workloads"
            unit: ratio
          expr: |
            sum(openshift:node:memory:bytes{utilized="true", scope="workloads"})
            /
            sum(kube_node_status_allocatable{resource="memory"})

        - record: openshift:cluster:memory:overcommit:ratio
          labels:
            scope: "workloads"
            unit: ratio
          expr: |
            sum(openshift:vm:memory:virtual_committed:bytes)
            /
            sum(kube_node_status_allocatable{resource="memory"})

    #
    # Tier 2 Rules
    #
    - name: cluster_operator_node_memory_tier2.rules
      rules:
        - record: openshift:node:memory:bytes
          labels:
            tier: "2"
            scope: "workloads"
            utilized: "true"
            temperature: "warm"
            unit: bytes
          expr: |
            sum by (node) (
              container_memory_swap{id="/kubepods.slice"}
            )

    - name: cluster_operator_node_memory_derived.rules
      rules:

        - record: openshift:node:memory:bytes
          labels:
            tier: "2"
            scope: "workloads"
            utilized: "false"
            unit: bytes
          expr: |
            sum by (node) (
              label_replace(
                node_memory_SwapTotal_bytes,
                "node", "$1", "instance", "(.+)"
              )
              - on (node)
              # Swap used (same as openshift:node:memory:bytes{tier="2", scope="workloads", utilized="true"})
              sum by (node) (container_memory_swap{id="/kubepods.slice"})
            )

    #
    #
    #
    # VM Rules
    #
    #
    #
    - name: cluster_operator_kubevirt_vm_memory.rules
      rules:
        - record: openshift:vm:memory:bytes
          labels:
            tier: "0"
            utilized: "true"
            temperature: "hot"
            unit: bytes
          expr: |
            max by (name, namespace, node) (
              max by (pod, namespace, node) (
                container_memory_working_set_bytes{pod=~"virt-launcher-.*", container=""}
              )
              * on (namespace, pod) group_left(name)
              label_replace(
                max by (name, namespace, node, vmi_pod) (kubevirt_vmi_info{vmi_pod!=""}),
                "pod", "$1", "vmi_pod", "(.*)"
              )
            )

        - record: openshift:vm:memory:bytes
          labels:
            tier: "0"
            utilized: "true"
            temperature: "warm"
            unit: bytes
          expr: |
            max by (name, namespace, node) (
              max by (pod, namespace, node) (
                container_memory_total_inactive_file_bytes{pod=~"virt-launcher-.*", container=""}
              )
              * on (namespace, pod) group_left(name)
              label_replace(
                max by (name, namespace, node, vmi_pod) (kubevirt_vmi_info{vmi_pod!=""}),
                "pod", "$1", "vmi_pod", "(.*)"
              )
            )

        - record: openshift:vm:memory:bytes
          labels:
            tier: "0"
            utilized: "false"
            unit: bytes
          expr: |
            max by (name, namespace, node) (
              openshift:vm:memory:requested:bytes
              - on (name, namespace, node)
              sum by (name, namespace, node) (openshift:vm:memory:bytes{utilized="true"})
            )

        - record: openshift:vm:memory:bytes
          labels:
            tier: "2"
            utilized: "true"
            temperature: "warm"
            unit: bytes
          expr: |
            max by (name, namespace, node) (
              max by (pod, namespace, node) (
                container_memory_swap{pod=~"virt-launcher-.*", container=""}
              )
              * on (namespace, pod) group_left(name)
              label_replace(
                max by (name, namespace, node, vmi_pod) (kubevirt_vmi_info{vmi_pod!=""}),
                "pod", "$1", "vmi_pod", "(.*)"
              )
            )

        - record: openshift:vm:memory:requested:bytes
          labels:
            unit: bytes
          expr: |
            sum by (name, namespace, node) (
              # Get total pod memory requests for virt-launcher
              sum by (pod, namespace, node) (
                kube_pod_container_resource_requests{resource="memory", pod=~"virt-launcher-.*"}
              )
              # Join with VMI info to add VM name
              * on (namespace, pod) group_left(name)
              label_replace(
                max by (name, namespace, node, vmi_pod) (kubevirt_vmi_info{vmi_pod!=""}),
                "pod", "$1", "vmi_pod", "(.*)"
              )
            )

        - record: openshift:vm:memory:virtual_committed:bytes
          labels:
            unit: bytes
          expr: |
            max by (name, namespace, node) (
              kubevirt_vmi_launcher_memory_overhead_bytes
              + on (name, namespace) group_right()
              kubevirt_vmi_memory_domain_bytes
            )

        - record: openshift:vm:memory:utilization:ratio
          labels:
            unit: ratio
          expr: |
            max by (name, namespace, node) (
              sum by (name, namespace, node) (openshift:vm:memory:bytes{utilized="true"})
              / on (name, namespace, node)
              openshift:vm:memory:requested:bytes
            )

        - record: openshift:vm:memory:overcommit:ratio
          labels:
            unit: ratio
          expr: |
            max by (name, namespace, node) (
              openshift:vm:memory:virtual_committed:bytes
              / on (name, namespace, node)
              openshift:vm:memory:requested:bytes
            )

    #
    # VARS
    #
    - name: cluster_operator_dashboard_variables.rules
      rules:
        # Dashboard query variables for memory metrics
        # These use template variables ($node, $role) that are substituted by the dashboard

        - record: x_kube_node_status_allocatable_memory_by_role
          expr: |
            (
            kube_node_status_allocatable{resource="memory", node=~"$node"} * on (node) kube_node_role{role="$role", node=~"$node"}
            )
          labels:
            DevelopmentPreview: "true"

        - record: x_kube_node_status_capacity_memory_by_role
          expr: |
            (
            kube_node_status_capacity{resource="memory", node=~"$node"} * on (node) kube_node_role{role="$role", node=~"$node"}
            )
          labels:
            DevelopmentPreview: "true"

        - record: x_kube_node_status_system_reserved_memory_by_role
          expr: |
            (
            sum(x_kube_node_status_capacity_memory_by_role) - sum(x_kube_node_status_allocatable_memory_by_role)
            )
          labels:
            DevelopmentPreview: "true"

        - record: x_node_memory_MemNotAvailable_bytes_by_role
          expr: |
            (
            label_replace(
              (node_memory_MemTotal_bytes{instance=~"$node"} - node_memory_MemAvailable_bytes{instance=~"$node"}),
              "node", "$1",
              "instance", "(.+)"
            ) * on (node) kube_node_role{role="$role", node=~"$node"}
            )
          labels:
            DevelopmentPreview: "true"

    #
    # LEGACY
    #
    - name: legacy.memorydashboard.rules
      rules:
        #
        # System
        #
        - record: openshift:node:system:memory:reserved
          expr: |
            sum(kube_node_status_capacity{resource="memory"} - kube_node_status_allocatable{resource="memory"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:system:memory:utilization
          expr: |
            sum (container_memory_rss{id="/system.slice"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        #
        # Utilization
        #
        # Availability Risk (OOM)
        # (node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes) / node_memory_MemTotal_bytes
        # Performance risk (cache)
        # (node_memory_Active_anon_bytes + node_memory_Active_file_bytes) / node_memory_MemTotal_bytes

        # Combined - Availability or performance risk
        - record: openshift:node:workloads:memory:allocatable
          expr: |
            sum(kube_node_status_allocatable{resource="memory"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:workloads:memory:utilization
          expr: |
            # FIXME this should actually be
            # container_memory_total_Active_anon_bytes + container_memory_total_Inactive_anon_bytes + container_memory_total_Active_file_bytes
            # but cri/cadvisor does not provide these metrics today.
            # https://github.com/google/cadvisor/pull/3750/changes
            sum(label_replace((node_memory_Active_anon_bytes + node_memory_Inactive_anon_bytes + node_memory_Active_file_bytes),
                          "node", "$1",
                          "instance", "(.*)"))
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"
            
        - record: openshift:node:workloads:swap
          expr: |
            sum(container_memory_swap{id="/kubepods.slice"})
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        - record: openshift:node:virtualization:memory:allocated
          expr: |
            sum(kubevirt_vmi_memory_domain_bytes)
            by (node, prometheus)
          labels:
            unit: bytes
            DevelopmentPreview: "true"

        #
        # Overcommittment
        #
        # Overcommitted - Negative values show under committment
        - record: openshift:node:virtualization:memory:overcommitted
          expr: |
            openshift:node:virtualization:memory:allocated - openshift:node:workloads:memory:allocatable
            
        - record: openshift:node:virtualization:overcommitted:ratio
          expr: |
            openshift:node:virtualization:memory:overcommitted / openshift:node:workloads:memory:allocatable
