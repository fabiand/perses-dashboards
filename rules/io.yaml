#apiVersion: monitoring.rhobs/v1
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: io-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: io.rules
      rules:
        # Per-device I/O utilization (busy time)
        # Fraction of time the device had at least one I/O request in flight
        - record: openshift:node:io:utilization:ratio
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: ratio
          expr: |
            label_replace(
              rate(node_disk_io_time_seconds_total{device=~"nvme.*|sd.*"}[2m]),
              "node", "$1", "instance", "(.+)"
            )

        # Cluster-wide I/O utilization (max across all devices)
        # Shows worst-case device busy time
        - record: openshift:cluster:io:utilization:ratio
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: ratio
          expr: |
            max(openshift:node:io:utilization:ratio)

        # Per-node latency histogram rate
        - record: openshift:node:io:latency:rate
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: seconds
          expr: |
            rate(kme_system_block_io_latency_seconds_bucket[2m])

        # Cluster-wide latency distribution: 0-10ms
        - record: openshift:cluster:io:latency:bucket:ratio
          labels:
            segment: "host_to_device"
            protocol: "block"
            le: "0.01"
            unit: ratio
          expr: |
            sum(rate(kme_system_block_io_latency_seconds_bucket{le="0.01"}[2m]))
            /
            sum(rate(kme_system_block_io_latency_seconds_count[2m]))

        # Cluster-wide latency distribution: 10-100ms
        - record: openshift:cluster:io:latency:bucket:ratio
          labels:
            segment: "host_to_device"
            protocol: "block"
            le: "0.1"
            g: "0.01"
            unit: ratio
          expr: |
            (
              sum(rate(kme_system_block_io_latency_seconds_bucket{le="0.1"}[2m]))
              - sum(rate(kme_system_block_io_latency_seconds_bucket{le="0.01"}[2m]))
            )
            /
            sum(rate(kme_system_block_io_latency_seconds_count[2m]))

        # Cluster-wide latency distribution: 100ms-1s
        - record: openshift:cluster:io:latency:bucket:ratio
          labels:
            segment: "host_to_device"
            protocol: "block"
            le: "1.0"
            g: "0.1"
            unit: ratio
          expr: |
            (
              sum(rate(kme_system_block_io_latency_seconds_bucket{le="1.0"}[2m]))
              - sum(rate(kme_system_block_io_latency_seconds_bucket{le="0.1"}[2m]))
            )
            /
            sum(rate(kme_system_block_io_latency_seconds_count[2m]))

        # Cluster-wide latency distribution: >1s
        - record: openshift:cluster:io:latency:bucket:ratio
          labels:
            segment: "host_to_device"
            protocol: "block"
            le: "+Inf"
            g: "1.0"
            unit: ratio
          expr: |
            (
              sum(rate(kme_system_block_io_latency_seconds_bucket{le="+Inf"}[2m]))
              - sum(rate(kme_system_block_io_latency_seconds_bucket{le="1.0"}[2m]))
            )
            /
            sum(rate(kme_system_block_io_latency_seconds_count[2m]))

        # Cluster-wide p50 (median) latency
        - record: openshift:cluster:io:latency:p50
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: seconds
          expr: |
            histogram_quantile(0.5,
              sum(rate(kme_system_block_io_latency_seconds_bucket[2m])) by (le)
            )

        # Cluster-wide p95 latency
        - record: openshift:cluster:io:latency:p95
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: seconds
          expr: |
            histogram_quantile(0.95,
              sum(rate(kme_system_block_io_latency_seconds_bucket[2m])) by (le)
            )

        # Cluster-wide p99 latency
        - record: openshift:cluster:io:latency:p99
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: seconds
          expr: |
            histogram_quantile(0.99,
              sum(rate(kme_system_block_io_latency_seconds_bucket[2m])) by (le)
            )

        # Per-node p95 latency
        - record: openshift:node:io:latency:p95
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: seconds
          expr: |
            histogram_quantile(0.95,
              sum(rate(kme_system_block_io_latency_seconds_bucket[2m])) by (le, node)
            )

        # Cluster-wide I/O pressure imbalance
        # p80 quantile of percentage point distance from mean pressure
        # Shows the spread: 80% of nodes are within this many percentage points of the mean
        # Values: <0.11 (±11pp) = healthy balanced, 0.11-0.22 = unhealthy balance, 0.22-0.33 = severely unbalanced, >0.33 = critically unbalanced
        - record: openshift:cluster:io:imbalance:distance:p80
          labels:
            segment: "host_to_device"
            protocol: "block"
            unit: ratio
          expr: |
            quantile(0.80,
              abs(
                openshift:node:io:pressure:ratio{severity="some"}
                -
                scalar(avg(openshift:node:io:pressure:ratio{severity="some"}))
              )
            )

        # Per-node I/O pressure (PSI)
        # Shows fraction of time tasks are waiting for I/O (some pressure)
        - record: openshift:node:io:pressure:ratio
          labels:
            severity: "some"
            unit: ratio
          expr: |
            label_replace(
              rate(node_pressure_io_waiting_seconds_total[2m]),
              "node", "$1", "instance", "(.+)"
            )
